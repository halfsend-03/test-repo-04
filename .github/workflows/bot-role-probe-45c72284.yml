# Behaviour-test bot-role probe shim (pkg/behaviourtest/steps/bot_role_probe.go).
# Pushed to a temporary branch of the leased test repository; scenario
# cleanup deletes the branch.
name: bot-role-probe-45c72284

on:
  push:
    branches: ['behaviour/bot-role-probe-45c72284']

permissions: {}

jobs:
  # Lookup of the registered review bot: must be recognized.
  control:
    permissions:
      contents: read
      id-token: write
    uses: halfsend-03/test-repo-04-mint-host/.github/workflows/bot-role-probe.yml@main
    with:
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      actor_login: 'fullsend-test-review[bot]'
      repo: 'halfsend-03/test-repo-04'
      mode: 'lookup'
      claimed_role: ''
      artifact_name: 'bot-role-probe-control'

  # The lookup under test.
  subject:
    permissions:
      contents: read
      id-token: write
    uses: halfsend-03/test-repo-04-mint-host/.github/workflows/bot-role-probe.yml@main
    with:
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      actor_login: 'fullsend-test-review[bot]'
      repo: 'halfsend-03/test-repo-04'
      mode: 'lookup'
      claimed_role: ''
      artifact_name: 'bot-role-probe-subject'
